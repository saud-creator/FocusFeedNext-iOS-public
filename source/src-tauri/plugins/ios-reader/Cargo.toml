[package]
name = "tauri-plugin-ios-reader"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-ios-reader"

[dependencies]
tauri = { version = "2.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
