name: FocusFeedNextNative
options:
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.10.0'
    CURRENT_PROJECT_VERSION: '100.1'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    SWIFT_INCLUDE_PATHS: '$(inherited) $(SRCROOT)/Generated'
    HEADER_SEARCH_PATHS: '$(inherited) $(SRCROOT)/Generated'
    OTHER_SWIFT_FLAGS: '$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Generated/FocusFeedNativeFFI.modulemap'
targets:
  FocusFeedNextNative:
    type: application
    platform: iOS
    productName: FocusFeedNext
    sources:
      - path: App
      - path: NativeServices
      - path: Integration
      - path: Generated
        excludes: ['*.h', '*.modulemap']
      - path: Resources
        buildPhase: resources
    info:
      path: Configuration/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusfeed.next
        PRODUCT_NAME: FocusFeedNext
        PRODUCT_MODULE_NAME: FocusFeedNextNative
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: '$(inherited) -lc++ -lz'
    dependencies:
      - framework: Frameworks/FocusFeedCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: AVKit.framework
      - sdk: ImageIO.framework
      - sdk: WebKit.framework
  FocusFeedNextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Services
        excludes: ['*.sh']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusfeed.next.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/FocusFeedNext.app/FocusFeedNext'
        BUNDLE_LOADER: '$(TEST_HOST)'
    dependencies:
      - target: FocusFeedNextNative
  FocusFeedNextUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusfeed.next.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FocusFeedNextNative
schemes:
  FocusFeedNextNative:
    build:
      targets:
        FocusFeedNextNative: all
    test:
      targets:
        - FocusFeedNextTests
        - FocusFeedNextUITests
      environmentVariables:
        OS_ACTIVITY_DT_MODE: NO
    archive:
      config: Release
