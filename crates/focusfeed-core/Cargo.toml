[package]
name = "focusfeed-core"
version = "0.10.0"
edition = "2021"
license = "MIT"
description = "Runtime-independent FocusFeed data and native media core"

[features]
default = []
dev-mock = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
log = "0.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
