description = "Synthetic credential fixtures"
regexTarget = "secret"
regexes = [
  '''^a1b2c3d4e5f60718293a4b5c6d7e8f9012345678$''',
  '''^a1b2c3d4e5f6a7b8c9d0$''',
]
