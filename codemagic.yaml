workflows:
  focusfeednext-ios-unsigned:
    name: FocusFeedNext iOS - tested unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $HOME/Library/Caches/ms-playwright
        - $HOME/Library/Caches/org.swift.swiftpm
    environment:
      xcode: 27.1
      node: 24
    scripts:
      - name: Check Apple toolchain
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test -f source/package-lock.json
          test -f source/tools/test-ios-simulator.sh
      - name: Install locked dependencies
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal
          fi
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
          cd source
          npm ci --no-audit --no-fund
          node tools/verify-release.mjs dist-ios/build-metadata.json
      - name: Frontend regression tests
        script: |
          cd source
          npm run lint
          npm run build
          npm test -- --maxWorkers=4 --reporter=default --reporter=junit --outputFile=dist-ios/frontend-tests.xml
        test_report: source/dist-ios/frontend-tests.xml
      - name: Shared Rust tests
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd source
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked 2>&1 | tee dist-ios/rust-tests.log
      - name: Native transport fixtures
        script: |
          cd source
          bash tools/test-ios-native.sh
      - name: Browser media and layout regression tests
        script: |
          cd source
          npx playwright install chromium webkit
          npm run dev -- --host 127.0.0.1 > dist-ios/vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi; sleep 1; done
          node tools/check-iphone-layout.mjs
      - name: iOS 27 simulator UI tests
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd source
          bash tools/test-ios-simulator.sh
      - name: Build verified unsigned iPhone IPA
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd source
          bash tools/build-ios-unsigned.sh "$BUILD_NUMBER"
          version=$(node -p "require('./package.json').version")
          python3 tools/verify-ipa.py dist-ios/FocusFeedNext-unsigned.ipa --version "$version" --output dist-ios/ipa-verification.json
    artifacts:
      - source/dist-ios/*.ipa
      - source/dist-ios/*.sha256
      - source/dist-ios/*.json
      - source/dist-ios/*.xml
      - source/dist-ios/*.log
      - source/dist-ios/native-tests/**
      - source/dist-ios/browser-checks/**
      - source/dist-ios/simulator-screenshots/**
      - source/dist-ios/SimulatorTests.xcresult/**
      - /tmp/xcodebuild_logs/*.log

