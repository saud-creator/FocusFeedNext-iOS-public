workflows:
  focusfeednext-ios-unsigned:
    name: FocusFeedNext iOS - unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 90
    # No triggering section: manual builds only.
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
    environment:
      xcode: latest
      node: 24
    scripts:
      - name: Check macOS build tools
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          node --version
          npm --version

      - name: Extract FocusFeedNext source
        script: |
          unzip -q FocusFeedNext-source.zip -d source
          mkdir -p source/tools
          cp build-ios-unsigned.sh source/tools/build-ios-unsigned.sh
          test -f source/package-lock.json

      - name: Install Rust and Node dependencies
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version
          cd source
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build unsigned iPhone IPA
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd source
          bash tools/build-ios-unsigned.sh 2

    artifacts:
      - source/dist-ios/*.ipa
      - source/dist-ios/*.sha256
      - source/dist-ios/build.log
      - /tmp/xcodebuild_logs/*.log
