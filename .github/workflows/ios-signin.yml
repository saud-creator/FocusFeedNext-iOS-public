name: Build 0.8.4 native content loading repair
on:
  push:
    branches: [codex/ios-0.8.4-feed-recovery]
    paths:
      - FocusFeedNext-source.zip
      - source/**
      - build-ios-unsigned.sh
      - .github/workflows/ios-signin.yml
permissions:
  contents: read
jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source snapshot
        run: |
          python3 - <<'PYZIP'
          import zipfile,pathlib
          with zipfile.ZipFile('FocusFeedNext-source.zip') as z:
            for name in z.namelist():
              assert pathlib.Path('source',name).read_bytes() == z.read(name), name
          PYZIP
          cp build-ios-unsigned.sh source/tools/build-ios-unsigned.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select iOS 26 SDK
        run: |
          selected=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)
          if [[ -n "$selected" ]]; then sudo xcode-select -s "$selected/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install dependencies
        working-directory: source
        run: |
          npm ci
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
      - name: Validate frontend and shared Rust
        working-directory: source
        run: |
          npm run check
          cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Run WebKit checks and build unsigned device IPA
        working-directory: source
        run: |
          set -o pipefail
          bash tools/build-ios-unsigned.sh 1 2>&1 | tee ../build-run.log
      - name: Verify unsigned IPA
        working-directory: source
        run: python3 tools/verify-ipa.py dist-ios/FocusFeedNext-unsigned.ipa --version 0.8.4 --output dist-ios/ipa-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: FocusFeedNext-0.8.4-unsigned-iPhone
          path: |
            source/dist-ios/FocusFeedNext-unsigned.ipa
            source/dist-ios/FocusFeedNext-unsigned.ipa.sha256
            source/dist-ios/ipa-verification.json
          retention-days: 14
      - name: Preserve build results in the private build branch
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p release/0.8.4
          if [[ -f build-run.log ]]; then cp build-run.log release/0.8.4/build.log; fi
          for file in FocusFeedNext-unsigned.ipa FocusFeedNext-unsigned.ipa.sha256 ipa-verification.json; do
            if [[ -f "source/dist-ios/$file" ]]; then cp "source/dist-ios/$file" "release/0.8.4/$file"; fi
          done
          if [[ -f source/dist-ios/native-tests/results.txt ]]; then cp source/dist-ios/native-tests/results.txt release/0.8.4/native-tests.txt; fi
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          result={"status":os.environ["BUILD_STATUS"],"runUrl":os.environ["BUILD_URL"],"sourceCommit":os.environ["SOURCE_COMMIT"],"sourceSha256":hashlib.sha256(pathlib.Path("FocusFeedNext-source.zip").read_bytes()).hexdigest()}
          pathlib.Path("release/0.8.4/build-result.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
          git config user.name 'FocusFeedNext build'
          git config user.email 'focusfeednext-build@users.noreply.github.com'
          git add -- release/0.8.4
          git commit -m 'Preserve 0.8.4 unsigned build results'
          git push origin HEAD:codex/ios-0.8.4-feed-recovery
